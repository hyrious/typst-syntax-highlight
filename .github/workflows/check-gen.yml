name: Check generated syntaxes

on:
  pull_request:
    paths:
      - 'gen/**'
      - 'Typst.sublime-syntax'
      - 'TypstCodeSyntaxes.sublime-syntax'

jobs:
  check-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: generate
        run: |
          cd gen
          cargo r

      - name: check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "generated files have uncommited changes"
            git status --short
            exit 1
          fi
